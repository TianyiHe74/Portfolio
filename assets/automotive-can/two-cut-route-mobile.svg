<svg xmlns="http://www.w3.org/2000/svg" width="420" height="650" viewBox="0 0 420 650" role="img" aria-labelledby="title desc">
<title id="title">Surviving route in the Pi-led two-cut CAN test</title>
<desc id="desc">Pi CAN B and N3 CAN A are disconnected. Pi communicates with N2 over CAN A; N2 forwards to N3 over CAN B.</desc>
<rect width="420" height="650" rx="16" fill="#e9ede2"/>
<g font-family="Arial, sans-serif" fill="#233e34">
<text x="210" y="37" text-anchor="middle" font-size="15" letter-spacing="2">TWO-CUT TEST / SURVIVING ROUTE</text>
<g fill="#fffefa" stroke="#b8c7ad" stroke-width="2"><rect x="45" y="66" width="330" height="128" rx="10"/><rect x="45" y="268" width="330" height="128" rx="10"/><rect x="45" y="470" width="330" height="128" rx="10"/></g>
<g text-anchor="middle"><text x="210" y="104" font-size="25" font-weight="bold">Pi / N1</text><text x="210" y="137" font-size="19">Cockpit · leader</text><text x="210" y="171" font-size="16" fill="#8d4f2d">CAN B disconnected</text><text x="210" y="306" font-size="25" font-weight="bold">STM32 / N2</text><text x="210" y="339" font-size="19">Front · bridge</text><text x="210" y="373" font-size="16">Both CAN connections intact</text><text x="210" y="508" font-size="25" font-weight="bold">STM32 / N3</text><text x="210" y="541" font-size="19">Rear · follower</text><text x="210" y="575" font-size="16" fill="#8d4f2d">CAN A disconnected</text></g>
<g fill="none" stroke="#203e33" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M210 207V255M202 215L210 207L218 215M202 247L210 255L218 247"/><path d="M210 409V457M202 417L210 409L218 417M202 449L210 457L218 449"/></g>
<text x="238" y="238" font-size="18" font-weight="bold">CAN A</text><text x="238" y="440" font-size="18" font-weight="bold">CAN B</text>
<text x="210" y="628" text-anchor="middle" font-size="16">N2 forwards between the surviving segments.</text>
</g></svg>
