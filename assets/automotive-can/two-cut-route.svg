<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Pi-led CAN network with two connections removed</title>
<desc id="desc">Pi CAN B and rear N3 CAN A are cut. The surviving route goes from Pi over CAN A to N2, then over CAN B to N3. The Pi is leader; N2 forwards between buses.</desc>
<rect width="1000" height="470" rx="16" fill="#e9ede2"/>
<g font-family="Arial, sans-serif" fill="#233e34">
<text x="42" y="43" font-size="15" letter-spacing="2">TESTED TOPOLOGY / TWO CAN CONNECTIONS REMOVED</text>
<path d="M100 140H900" stroke="#6a805b" stroke-width="5"/>
<path d="M100 355H900" stroke="#6a805b" stroke-width="5"/>
<text x="42" y="112" font-size="20" font-weight="bold">CAN A</text><text x="42" y="393" font-size="20" font-weight="bold">CAN B</text>
<g stroke="#203e33" stroke-width="6" fill="none"><path d="M180 195V140H470V195"/><path d="M470 293V355H780V293"/></g>
<g stroke="#ad6d47" stroke-width="3" stroke-dasharray="7 7"><path d="M780 140V195"/><path d="M180 293V355"/></g>
<g stroke="#ad6d47" stroke-width="4"><path d="M770 159L790 179M790 159L770 179M170 314L190 334M190 314L170 334"/></g>
<g fill="#fffefa" stroke="#b8c7ad" stroke-width="2"><rect x="90" y="195" width="180" height="98" rx="10"/><rect x="380" y="195" width="180" height="98" rx="10"/><rect x="690" y="195" width="180" height="98" rx="10"/></g>
<g text-anchor="middle"><text x="180" y="231" font-size="24" font-weight="bold">Pi / N1</text><text x="180" y="266" font-size="18">Cockpit · leader</text><text x="470" y="231" font-size="24" font-weight="bold">STM32 / N2</text><text x="470" y="266" font-size="18">Front · bridge</text><text x="780" y="231" font-size="24" font-weight="bold">STM32 / N3</text><text x="780" y="266" font-size="18">Rear · follower</text></g>
<g fill="#8d4f2d" font-size="17"><text x="801" y="176">CUT</text><text x="203" y="331">CUT</text></g>
<g fill="#203e33"><circle cx="180" cy="140" r="6"/><circle cx="470" cy="140" r="6"/><circle cx="470" cy="355" r="6"/><circle cx="780" cy="355" r="6"/></g>
<text x="500" y="435" font-size="21" text-anchor="middle">Surviving route: Pi ↔ CAN A ↔ N2 ↔ CAN B ↔ N3</text>
</g></svg>
