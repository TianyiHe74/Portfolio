<svg xmlns="http://www.w3.org/2000/svg" width="540" height="340" viewBox="0 0 540 340" role="img" aria-labelledby="title desc">
<title id="title">From signal to motion</title><desc id="desc">Conceptual diagram of the implemented STM32 motor-control loop. Encoder feedback feeds a FreeRTOS PID task. PWM and direction outputs drive the motor, completing the feedback loop.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#a6bdac" opacity=".14"/></pattern><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#bed7a8" stroke-width="1.3"/></marker></defs>
<rect width="540" height="340" fill="url(#grid)"/>
<g fill="none" stroke="#bed7a8" stroke-width="1.5" marker-end="url(#a)"><path d="M180 148H216"/><path d="M336 148H377"/><path d="M433 206V268H110V194"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle"><text x="110" y="77" fill="#a6bdac" font-size="10" letter-spacing="2">01 / SENSE</text><text x="276" y="77" fill="#a6bdac" font-size="10" letter-spacing="2">02 / COMPUTE</text><text x="434" y="77" fill="#a6bdac" font-size="10" letter-spacing="2">03 / ACTUATE</text>
<rect x="43" y="105" width="137" height="87" rx="10" stroke="#779780" fill="#294c40"/><text x="111" y="141" font-size="18" fill="#f3f0e6">Encoder</text><text x="111" y="164" font-size="11" fill="#c6d5ca">Position / EXTI ISR</text>
<rect x="216" y="96" width="120" height="105" rx="10" fill="#d3e0b5"/><text x="276" y="133" font-size="24" fill="#213f34">PID</text><text x="276" y="155" font-size="11" fill="#375342">FreeRTOS task</text>
<circle cx="434" cy="148" r="52" fill="#294c40" stroke="#779780"/><circle cx="434" cy="148" r="33" fill="none" stroke="#90ad96" stroke-dasharray="3 5"/><text x="434" y="154" font-size="18" fill="#f3f0e6">Motor</text><text x="363" y="127" font-size="10" fill="#c6d5ca">PWM</text><rect x="187" y="257" width="172" height="23" fill="#203e33"/><text x="273" y="272" font-size="11" fill="#c6d5ca" letter-spacing="1">POSITION FEEDBACK</text></g></svg>
